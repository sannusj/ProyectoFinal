<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Registro | Solea</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container d-flex justify-content-center" style="min-height:80vh; align-items:center;">
    <div class="card shadow-sm w-100" style="max-width:480px;">
        <div class="card-body p-4">

            <div class="text-center mb-3">
                <h2 class="fw-bold">SOLEA</h2>
                <p class="text-muted mb-0">Crea tu cuenta</p>
            </div>

            <!-- MENSAJE DE ERROR -->
            <div th:if="${error}" class="alert alert-danger text-center">
                <span th:text="${error}"></span>
            </div>

            <!-- FORMULARIO -->
            <form th:action="@{/auth/registro}" method="post" th:object="${usuario}">
                <!-- Evitar evaluar _csrf.parameterName (puede ser null), usar name estático y th:value -->
                <input th:if="${_csrf != null}" type="hidden" name="_csrf" th:value="${_csrf.token}" />

                <div class="mb-3">
                    <label class="form-label">Nombre completo</label>
                    <input type="text" class="form-control"
                           th:field="*{nombre}" placeholder="Tu nombre" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Correo electrónico</label>
                    <input type="email" class="form-control"
                           th:field="*{email}" placeholder="Tu email" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Contraseña</label>
                    <input type="password" class="form-control"
                           th:field="*{pass}" placeholder="Crea una contraseña" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Teléfono</label>
                    <input type="text" class="form-control"
                           th:field="*{tel}" placeholder="Número de contacto">
                </div>

                <div class="mb-3">
                    <label class="form-label">País</label>
                    <input type="text" class="form-control"
                           th:field="*{pais}" placeholder="Tu país">
                </div>

                <div class="d-grid mt-4">
                    <button class="btn btn-dark">Registrarme</button>
                </div>

            </form>

            <p class="text-center mt-3 mb-0">
                ¿Ya tienes cuenta?
                <a th:href="@{/auth/login}">Inicia sesión aquí</a>
            </p>

        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
