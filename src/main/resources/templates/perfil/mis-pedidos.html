<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Mis Pedidos | Solea</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/solea-theme.css}" />
</head>

<body class="bg-light">

<th:block th:replace="~{fragments/navbar :: navbar}"></th:block>

<div class="container mt-5">
    <div class="card shadow-sm p-4">

        <h3 class="mb-4">Mis pedidos</h3>

        <table class="table table-hover">
            <thead>
            <tr>
                <th>ID</th>
                <th>Fecha</th>
                <th>Total</th>
                <th>Estado</th>
            </tr>
            </thead>

            <tbody>
            <tr th:each="p : ${pedidos}">
                <td th:text="${p.id}"></td>
                <td th:text="${#temporals.format(p.fechaCreacion, 'dd/MM/yyyy HH:mm')}"></td>
                <td th:text="${p.total}"></td>
                <td>
                    <span class="badge bg-dark" th:text="${p.estado}"></span>
                </td>
            </tr>
            </tbody>
        </table>

        <a th:href="@{/}" class="btn btn-secondary mt-3">Volver</a>

    </div>
</div>

<th:block th:replace="~{fragments/footer :: footer}"></th:block>

</body>
</html>
