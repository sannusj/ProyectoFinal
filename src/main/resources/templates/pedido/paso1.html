<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Pedido - Paso 1</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/solea-theme.css}" />
</head>
<body class="bg-light">

<div class="container my-5">

    <!-- Barra de progreso -->
    <div class="progress mb-4" style="height: 20px;">
        <div class="progress-bar bg-primary" role="progressbar" style="width: 33%;">
            Paso 1 de 3
        </div>
    </div>

    <div class="card shadow p-4">
        <h3 class="mb-3">Información de envío</h3>

        <form action="/pedido/paso1" method="post">
            <div class="mb-3">
                <label class="form-label">Nombre completo</label>
                <input type="text" name="nombre" class="form-control" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Dirección</label>
                <input type="text" name="direccion" class="form-control" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Provincia / Departamento</label>
                <input type="text" name="provincia" class="form-control" required>
            </div>

            <button class="btn btn-primary w-100" type="submit">Continuar →</button>
        </form>
    </div>
</div>

<script src="/pedido-paso1.js"></script>
