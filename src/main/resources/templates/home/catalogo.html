<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Catálogo - Solea</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

<!-- NAVBAR -->
<th:block th:replace="~{fragments/navbar :: navbar}"></th:block>


<!-- ===================== BUSCADOR ===================== -->
<div class="container mt-5">
    <h1 class="fw-bold mb-4 text-center">Catálogo de Prendas</h1>

    <form class="row justify-content-center mb-5" method="get" th:action="@{/catalogo}">
        <div class="col-md-6">
            <input type="text" name="nombre"
                   class="form-control rounded-pill shadow-sm"
                   placeholder="Buscar prendas..."
                   th:value="${param.nombre}">
        </div>
        <div class="col-md-2">
            <button class="btn btn-dark w-100 py-2">Buscar</button>
        </div>
    </form>
</div>


<!-- ===================== PRODUCT GRID ===================== -->
<div class="container pb-5">
    <div class="row g-4">

        <!-- Producto -->
        <div class="col-xl-3 col-lg-4 col-md-6" th:each="p : ${productos}">
            <div class="card shadow-sm h-100">

                <!-- Imagen -->
                <img class="card-img-top" style="height:260px; object-fit:cover;"
                     th:src="@{'/imagenes/' + ${p.id}}"
                     alt="Imagen de prenda">

                <div class="card-body d-flex flex-column">

                    <!-- Nombre -->
                    <h5 class="fw-bold" th:text="${p.nombre}">Prenda</h5>

                    <!-- Categoría -->
                    <p class="text-muted small mb-1"
                       th:text="${p.categoria != null ? p.categoria.nombre : 'Sin categoría'}">
                        Categoría
                    </p>

                    <!-- Descripción corta -->
                    <p class="small text-muted mb-3"
                       th:text="${#strings.abbreviate(p.descripcion, 80)}">
                        Descripción corta
                    </p>

                    <!-- Precio + Botones -->
                    <div class="mt-auto d-flex justify-content-between align-items-center gap-2">
                        <span class="fw-bold" th:text="'$ ' + ${p.precio}">Precio</span>

                        <a th:href="@{'/detalle/' + ${p.id}}"
                           class="btn btn-dark btn-sm">
                            Ver más
                        </a>

                        <!-- Formulario agregar al carrito -->
                        <form th:action="@{/carrito/agregar}" method="post" class="d-flex gap-2" th:if="${p.stock > 0}">
                            <input th:if="${_csrf != null}" type="hidden" name="_csrf" th:value="${_csrf.token}" />
                            <input type="hidden" name="prendaId" th:value="${p.id}" />
                            <input type="hidden" name="cantidad" value="1" />
                            <button type="submit" class="btn btn-outline-primary btn-sm">Añadir</button>
                        </form>

                        <span th:if="${p.stock == 0}" class="badge bg-danger small">Agotado</span>

                    </div>

                </div>
            </div>
        </div>


        <!-- Placeholder si no hay productos -->
        <div class="text-center text-muted mt-5"
             th:if="${#lists.isEmpty(productos)}">
            <h4>No se encontraron productos.</h4>
            <p>Prueba buscar con otras palabras.</p>
        </div>

    </div>
</div>


<!-- FOOTER -->
<th:block th:replace="~{fragments/footer :: footer}"></th:block>


<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
