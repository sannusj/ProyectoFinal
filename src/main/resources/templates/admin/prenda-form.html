<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title th:text="${prenda.id == null ? 'Nueva Prenda' : 'Editar Prenda'}"></title>

    <!-- Bootstrap -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"/>

    <!-- Icons -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css"/>
</head>

<body>

<div th:replace="fragments/navbar :: navbar"></div>

<div class="container py-5">

    <div class="card shadow-sm border-0">

        <div class="card-header bg-dark text-white">
            <h4 class="mb-0" th:text="${prenda.id == null ? 'Crear Nueva Prenda' : 'Editar Prenda'}"></h4>
        </div>

        <div class="card-body">

            <!-- Mensaje de error -->
            <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

            <form th:action="${prenda.id == null
                                ? '/admin/prendas/guardar'
                                : '/admin/prendas/' + prenda.id + '/editar'}"
                  th:object="${prenda}"
                  method="post"
                  enctype="multipart/form-data"
                  class="row g-4">

                <!-- Nombre -->
                <div class="col-md-6">
                    <label class="form-label fw-semibold">Nombre</label>
                    <input type="text" th:field="*{nombre}" class="form-control" placeholder="Ej: Camisa oversize" required>
                </div>

                <!-- Categoría (select cargado desde controller) -->
                <div class="col-md-6">
                    <label class="form-label fw-semibold">Categoría</label>
                    <select name="categoriaId" class="form-select">
                        <option th:each="c : ${categorias}"
                                th:value="${c.id}"
                                th:text="${c.nombre}"
                                th:selected="${prenda.categoria != null and prenda.categoria.id == c.id}">
                        </option>
                    </select>
                </div>

                <!-- Descripción -->
                <div class="col-12">
                    <label class="form-label fw-semibold">Descripción</label>
                    <textarea th:field="*{descripcion}" class="form-control" rows="3"
                              placeholder="Detalles del producto..."></textarea>
                </div>

                <!-- Precio -->
                <div class="col-md-4">
                    <label class="form-label fw-semibold">Precio</label>
                    <div class="input-group">
                        <span class="input-group-text">$</span>
                        <input type="number" step="0.01" th:field="*{precio}" class="form-control" required>
                    </div>
                </div>

                <!-- Stock -->
                <div class="col-md-4">
                    <label class="form-label fw-semibold">Stock</label>
                    <input type="number" th:field="*{stock}" class="form-control" min="0" required>
                </div>

                <!-- Talla -->
                <div class="col-md-4">
                    <label class="form-label fw-semibold">Talla</label>
                    <input type="text" th:field="*{talla}" class="form-control" placeholder="M, L, XL, 32...">
                </div>

                <!-- Imagen actual -->
                <div class="col-md-6">
                    <label class="form-label fw-semibold">Imagen actual</label>
                    <div class="border p-3 rounded text-center">

                        <!-- Mostrar imagen si existe vía /imagenes/{id} -->
                        <img th:if="${prenda.id != null}" th:src="@{'/imagenes/' + ${prenda.id}}"
                             class="img-fluid rounded"
                             style="max-height: 200px; object-fit: cover;">

                        <p th:if="${prenda.id == null}" class="text-muted">
                            No hay imagen cargada
                        </p>
                    </div>
                </div>

                <!-- Subir imagen nueva -->
                <div class="col-md-6">
                    <label class="form-label fw-semibold">Subir nueva imagen</label>
                    <input type="file" name="imagenFile" class="form-control" accept="image/*">
                </div>

                <!-- Botones -->
                <div class="col-12 mt-4 d-flex justify-content-between">

                    <a href="/admin/prendas" class="btn btn-secondary">
                        <i class="bi bi-arrow-left"></i> Volver
                    </a>

                    <button type="submit" class="btn btn-success">
                        <i class="bi bi-save"></i>
                        <span th:text="${prenda.id == null ? 'Guardar' : 'Actualizar'}"></span>
                    </button>

                </div>

            </form>
        </div>
    </div>

</div>

<div th:replace="fragments/footer :: footer"></div>

</body>
</html>
