<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Mi Carrito | Solea</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container" style="max-width:1100px; padding-top:40px; padding-bottom:40px;">

    <h2 class="mb-4 fw-bold">🛒 Mi Carrito</h2>

    <!-- Si el carrito está vacío -->
    <div th:if="${productos.size() == 0}" class="alert alert-info text-center">
        Tu carrito está vacío. <a href="/" class="alert-link">Ir a la tienda</a>.
    </div>

    <!-- Lista de productos -->
    <div th:each="item : ${productos}" class="card mb-3 p-3">
        <div class="row g-3 align-items-center">

            <!-- Imagen del producto -->
            <div class="col-md-2 text-center">
                <img th:src="${item.imagen}"
                     class="img-fluid rounded" style="width:120px; height:120px; object-fit:cover;" alt="Producto" th:if="${item.imagen != null}" />
                <img src="https://via.placeholder.com/120" class="img-fluid rounded" style="width:120px; height:120px; object-fit:cover;" alt="Producto" th:if="${item.imagen == null}" />
            </div>

            <!-- Información -->
            <div class="col-md-5">
                <h5 th:text="${item.nombre}" class="fw-bold"></h5>
                <p class="text-muted mb-1">Precio: $<span th:text="${item.precio}"></span></p>
                <p class="text-muted">Subtotal: $<span th:text="${item.subtotal}"></span></p>
            </div>

            <!-- Cantidad -->
            <div class="col-md-2">
                <form th:action="@{/carrito/actualizar}" method="post" class="d-flex gap-2 align-items-center">
                    <input th:if="${_csrf != null}" type="hidden" name="_csrf" th:value="${_csrf.token}" />
                    <input type="hidden" name="prendaId" th:value="${item.id}" />
                    <input type="number" name="cantidad" min="1" class="form-control" style="width:90px;" th:value="${item.cantidad}">
                    <button class="btn btn-outline-dark btn-sm">Actualizar</button>
                </form>
            </div>

            <!-- Eliminar -->
            <div class="col-md-3 text-end">
                <form th:action="@{/carrito/eliminar}" method="post">
                    <input th:if="${_csrf != null}" type="hidden" name="_csrf" th:value="${_csrf.token}" />
                    <input type="hidden" name="prendaId" th:value="${item.id}" />
                    <button class="btn btn-danger btn-sm">Eliminar</button>
                </form>
            </div>
        </div>
    </div>


    <!-- Resumen del total -->
    <div th:if="${productos.size() > 0}" class="mt-4">
        <div class="card p-3">

            <h4 class="fw-bold">Total: $<span th:text="${total}"></span></h4>

            <div class="d-flex justify-content-between mt-3">

                <!-- Vaciar carrito -->
                <form th:action="@{/carrito/vaciar}" method="post">
                    <input th:if="${_csrf != null}" type="hidden" name="_csrf" th:value="${_csrf.token}" />
                    <button class="btn btn-outline-danger">Vaciar Carrito</button>
                </form>

                <!-- Ir al checkout -->
                <a href="/carrito/checkout" class="btn btn-dark">Continuar con la compra →</a>

            </div>

        </div>
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
