<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Mi Perfil | Solea</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/solea-theme.css}" />
</head>

<body class="bg-light">

<!-- NAVBAR -->
<th:block th:replace="~{fragments/navbar :: navbar}"></th:block>

<div class="container mt-5">

    <div class="card shadow-sm p-4">

        <h3 class="mb-4">Mi Perfil</h3>

        <div class="row">
            <div class="col-md-4 text-center">
                <img th:if="${usuario.avatar != null}"
                     th:src="@{/usuario/avatar/{id}(id=${usuario.id})}"
                     class="img-thumbnail rounded-circle" style="width:160px; height:160px;">
                <img th:if="${usuario.avatar == null}"
                     src="https://cdn-icons-png.flaticon.com/512/847/847969.png"
                     class="img-thumbnail rounded-circle" style="width:160px; height:160px;">
            </div>

            <div class="col-md-8">

                <p><strong>Nombre:</strong> <span th:text="${usuario.nombre}"></span></p>
                <p><strong>Email:</strong> <span th:text="${usuario.email}"></span></p>
                <p><strong>Teléfono:</strong> <span th:text="${usuario.tel}"></span></p>
                <p><strong>País:</strong> <span th:text="${usuario.pais}"></span></p>
                <p><strong>Rol:</strong> <span th:text="${usuario.rol}"></span></p>

                <a class="btn btn-dark mt-3" th:href="@{/perfil/editar}">Editar datos</a>
                <a class="btn btn-outline-dark mt-3" th:href="@{/perfil/password}" th:if="${usuario.provider.name() == 'LOCAL'}">Cambiar contraseña</a>
                <a class="btn btn-secondary mt-3" th:href="@{/perfil/mis-pedidos}">Mis pedidos</a>

            </div>
        </div>

    </div>

</div>

<!-- FOOTER -->
<th:block th:replace="~{fragments/footer :: footer}"></th:block>

</body>
</html>
