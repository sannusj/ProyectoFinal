<!-- Cargar estilos globales de la app (tema Solea) -->
<link rel="stylesheet" th:href="@{/css/solea-theme.css}" />

<nav th:fragment="navbar" class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a th:href="@{/}" class="navbar-brand fw-bold">SOLEA</a>

        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNavbar"
                aria-controls="mainNavbar" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="mainNavbar">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                <li class="nav-item"><a class="nav-link" th:href="@{/}">Inicio</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/catalogo}">Catálogo</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/nosotros}">Nosotros</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/contacto}">Contacto</a></li>

                <!-- Menú Admin visible solo si el usuario está autenticado y es ADMIN -->
                <li class="nav-item dropdown" th:if="${usuario != null and usuario.rol.name() == 'ADMIN'}">
                    <a class="nav-link dropdown-toggle" href="#" id="adminMenu" role="button" data-bs-toggle="dropdown"
                       aria-expanded="false">Admin</a>
                    <ul class="dropdown-menu" aria-labelledby="adminMenu">
                        <li><a class="dropdown-item" th:href="@{/admin}">Panel</a></li>
                        <li><a class="dropdown-item" th:href="@{/admin/usuarios}">Usuarios</a></li>
                        <li><a class="dropdown-item" th:href="@{/admin/prendas}">Prendas</a></li>
                        <li><a class="dropdown-item" th:href="@{/admin/pedidos}">Pedidos</a></li>
                    </ul>
                </li>

            </ul>

            <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
                <li class="nav-item" th:if="${usuario != null and usuario.rol.name() != 'ADMIN'}">
                    <a class="nav-link" th:href="@{/carrito}">Carrito 🛒</a>
                </li>

                <li class="nav-item dropdown" th:if="${usuario != null}">
                    <a class="nav-link dropdown-toggle" href="#" id="userMenu" role="button" data-bs-toggle="dropdown"
                       aria-expanded="false">
                        <span th:text="${usuario.nombre}">Usuario</span>
                    </a>
                    <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="userMenu">
                        <li>
                            <a class="dropdown-item"
                               th:href="${usuario != null and usuario.rol.name() == 'ADMIN'} ? @{/admin/perfil} : @{/perfil}">
                                Mi perfil
                            </a>
                        </li>
                        <li th:if="${usuario == null or usuario.rol.name() != 'ADMIN'}">
                            <a class="dropdown-item" th:href="@{/perfil/mis-pedidos}">Mis pedidos</a>
                        </li>
                        <li><hr class="dropdown-divider"></li>
                        <li><a class="dropdown-item text-danger" th:href="@{/auth/logout}">Cerrar sesión</a></li>
                    </ul>
                </li>

                <li class="nav-item" th:if="${usuario == null}">
                    <a class="nav-link" th:href="@{/auth/login}">Iniciar sesión</a>
                </li>
            </ul>
        </div>
    </div>
</nav>
