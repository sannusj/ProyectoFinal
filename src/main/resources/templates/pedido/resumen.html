<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Resumen del Pedido | Solea</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container" style="max-width:900px; padding:40px 0;">

    <!-- Barra de progreso -->
    <div class="mb-4">
        <div class="progress" style="height:12px;">
            <div class="progress-bar bg-dark" style="width:100%;"></div>
        </div>
        <div class="d-flex justify-content-between mt-2">
            <span class="text-muted">Paso 1</span>
            <span class="text-muted">Paso 2</span>
            <span class="text-muted">Paso 3</span>
            <span class="fw-bold">Resumen</span>
        </div>
    </div>

    <!-- Título -->
    <h2 class="mb-4 text-center fw-bold">Resumen del Pedido</h2>

    <!-- Datos de envío -->
    <div class="card mb-4 shadow-sm">
        <div class="card-body">
            <h5 class="fw-bold mb-3">Datos de Envío</h5>

            <p class="mb-1"><strong>Nombre:</strong> <span th:text="${resumen.nombre}"></span></p>
            <p class="mb-1"><strong>Dirección:</strong> <span th:text="${resumen.direccion}"></span></p>
            <p class="mb-1"><strong>Provincia:</strong> <span th:text="${resumen.provincia}"></span></p>
        </div>
    </div>

    <!-- Datos adicionales -->
    <div class="card mb-4 shadow-sm">
        <div class="card-body">
            <h5 class="fw-bold mb-3">Información Adicional</h5>

            <p class="mb-1"><strong>Regalo:</strong> <span th:text="${resumen.regalo} ? 'Sí' : 'No'"></span></p>

            <p class="mb-1"><strong>Observaciones:</strong> <span th:text="${resumen.observaciones != null ? resumen.observaciones : 'Ninguna'}"></span></p>
        </div>
    </div>

    <!-- Lista de productos -->
    <div class="card mb-4 shadow-sm">
        <div class="card-body">
            <h5 class="fw-bold mb-3">Productos del Pedido</h5>

            <table class="table table-borderless align-middle">
                <thead>
                <tr>
                    <th>Producto</th>
                    <th class="text-center">Cantidad</th>
                    <th class="text-end">Subtotal</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="p : ${productos}">
                    <td>
                        <div class="d-flex align-items-center">
                            <img th:src="${p.imagen}" style="width:55px; height:55px; object-fit:cover; border-radius:8px;" class="me-3" alt="producto">
                            <span th:text="${p.nombre}"></span>
                        </div>
                    </td>
                    <td class="text-center" th:text="${p.cantidad}"></td>
                    <td class="text-end">$<span th:text="${#numbers.formatDecimal(p.precio * p.cantidad, 1, 'COMMA', 2, 'POINT')}"></span></td>
                </tr>
                </tbody>
            </table>

            <div class="text-end mt-3">
                <h5>Total: <strong>$<span th:text="${total}"></span></strong></h5>
            </div>
        </div>
    </div>

    <!-- Botones -->
    <div class="d-flex gap-3">

        <!-- Botón PDF -->
        <a href="/pedido/pdf" target="_blank" class="btn btn-outline-secondary flex-fill">Descargar PDF</a>

        <!-- Botón Confirmar -->
        <form th:action="@{/pedido/confirmar}" method="post" class="flex-fill">
            <input th:if="${_csrf != null}" type="hidden" name="_csrf" th:value="${_csrf.token}" />
            <button class="btn btn-dark w-100">Confirmar Pedido</button>
        </form>

    </div>

</div>

</body>
</html>
