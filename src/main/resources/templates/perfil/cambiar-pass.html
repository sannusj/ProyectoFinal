<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Cambiar Contraseña | Solea</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-5">
    <div class="card shadow-sm p-4">

        <h3>Cambiar Contraseña</h3>

        <div th:if="${error}" class="alert alert-danger mt-3" th:text="${error}"></div>
        <div th:if="${exito}" class="alert alert-success mt-3" th:text="${exito}"></div>

        <form th:action="@{/perfil/password}" method="post">

            <div class="mb-3">
                <label class="form-label">Contraseña actual</label>
                <input type="password" class="form-control" name="actual" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Nueva contraseña</label>
                <input type="password" class="form-control" name="nueva" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Repetir nueva contraseña</label>
                <input type="password" class="form-control" name="repetir" required>
            </div>

            <button type="submit" class="btn btn-dark">Actualizar contraseña</button>
            <a th:href="@{/perfil}" class="btn btn-secondary">Cancelar</a>

        </form>

    </div>
</div>

</body>
</html>
