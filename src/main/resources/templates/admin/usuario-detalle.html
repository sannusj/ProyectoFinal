<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Detalle Usuario</title>

    <!-- Bootstrap -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">

    <!-- Iconos -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

    <link rel="stylesheet" th:href="@{/css/solea-theme.css}" />
</head>
<body>

<!-- Navbar -->
<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container py-5">
    <a href="/admin/usuarios" class="btn btn-outline-secondary mb-3">
        <i class="bi bi-arrow-left"></i> Volver
    </a>

    <h2 class="fw-bold mb-4">
        <i class="bi bi-person-badge-fill"></i> Detalle del Usuario
    </h2>

    <div class="row">
        <div class="col-lg-6">

            <div class="card shadow-sm border-0">
                <div class="card-body">

                    <h4 class="mb-3" th:text="${usuario.nombre}"></h4>

                    <p><strong>Email:</strong> <span th:text="${usuario.email}"></span></p>
                    <p><strong>Teléfono:</strong> <span th:text="${usuario.tel}"></span></p>
                    <p><strong>País:</strong> <span th:text="${usuario.pais}"></span></p>

                    <p>
                        <strong>Rol actual:</strong>
                        <span class="badge"
                              th:classappend="${usuario.rol.name() == 'ADMIN'} ? 'bg-danger' : 'bg-secondary'"
                              th:text="${usuario.rol}">
                        </span>
                    </p>

                    <!-- Mensajes -->
                    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
                    <div th:if="${msg}" class="alert alert-success" th:text="${msg}"></div>

                    <hr>

                    <form th:action="@{'/admin/usuarios/' + ${usuario.id} + '/cambiar-rol'}"
                          method="post"
                          class="mt-3">

                        <label for="rol" class="form-label fw-semibold">Cambiar Rol:</label>
                        <select name="nuevoRol" id="rol" class="form-select">
                            <option value="USER"
                                    th:selected="${usuario.rol.name() == 'USER'}">
                                Usuario
                            </option>
                            <option value="ADMIN"
                                    th:selected="${usuario.rol.name() == 'ADMIN'}">
                                Administrador
                            </option>
                        </select>

                        <button class="btn btn-primary mt-3">
                            <i class="bi bi-arrow-repeat"></i> Actualizar Rol
                        </button>

                    </form>

                </div>
            </div>

        </div>
    </div>
</div>

<!-- Footer -->
<div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>
