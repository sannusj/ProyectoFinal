<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>403 - Acceso denegado | Solea</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/solea-theme.css}" />
</head>
<body>

<!-- Navbar -->
<th:block th:replace="~{fragments/navbar :: navbar}"></th:block>

<div class="container text-center" style="padding:80px 0;">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow-sm">
                <div class="card-body py-5">
                    <h1 class="display-4 text-danger">403</h1>
                    <h2 class="fw-bold">Acceso denegado</h2>
                    <p class="lead mt-3">No tienes permisos para acceder a esta sección o realizar esta acción.</p>

                    <p class="text-muted">Si crees que esto es un error, contacta con el administrador o inicia sesión con una cuenta con permisos apropiados.</p>

                    <div class="mt-4 d-flex justify-content-center gap-3">
                        <a th:href="@{/}" class="btn btn-outline-primary">Volver al inicio</a>
                        <a th:href="@{/auth/login}" class="btn btn-primary">Iniciar sesión</a>
                    </div>
                </div>
            </div>
            <p class="text-center text-muted mt-3 small">Código de error generado: <span th:text="${status}">403</span></p>
        </div>
    </div>
</div>

<!-- Footer -->
<th:block th:replace="~{fragments/footer :: footer}"></th:block>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
