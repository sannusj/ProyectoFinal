<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Pedidos | Admin</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container py-4">
    <div class="card shadow-sm">
        <div class="card-body">
            <h3 class="mb-4">Gestión de Pedidos</h3>

            <table class="table table-striped align-middle">
                <thead class="table-dark">
                <tr>
                    <th>ID</th>
                    <th>Cliente</th>
                    <th>Total</th>
                    <th>Estado</th>
                    <th>Fecha</th>
                    <th></th>
                </tr>
                </thead>
                <tbody>

                <tr th:each="pedido : ${pedidos}">
                    <td th:text="${pedido.id}"></td>

                    <td th:text="${pedido.usuario.nombre}"></td>

                    <td>$<span th:text="${#numbers.formatDecimal(pedido.total, 1, 'POINT', 2, 'NONE')}"></span></td>

                    <td>
                        <span class="badge"
                              th:classappend="${pedido.estado} == 'PENDIENTE' ? ' bg-warning text-dark' : ( ${pedido.estado} == 'EN PROCESO' ? ' bg-primary' : ( ${pedido.estado} == 'ENVIADO' ? ' bg-success' : ' bg-danger'))"
                              th:text="${pedido.estado}">
                        </span>
                    </td>

                    <td th:text="${#temporals.format(pedido.fechaCreacion, 'dd/MM/yyyy HH:mm')}"></td>

                    <td>
                        <a class="btn btn-sm btn-primary" th:href="@{'/admin/pedidos/' + ${pedido.id}}">Ver Detalle</a>
                    </td>
                </tr>

                </tbody>
            </table>
        </div>
    </div>
</div>

</body>
</html>
