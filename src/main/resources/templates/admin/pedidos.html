<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Pedidos | Admin</title>

    <!-- Bootstrap -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">

    <!-- Icons -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

    <link rel="stylesheet" th:href="@{/css/solea-theme.css}" />
</head>
<body>

<!-- Navbar -->
<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container py-5">

    <h2 class="fw-bold mb-4">
        <i class="bi bi-receipt-cutoff"></i> Gestión de Pedidos
    </h2>

    <div class="card shadow-sm border-0">
        <div class="card-body">

            <div class="table-responsive">
                <table class="table align-middle">
                    <thead class="table-dark">
                    <tr>
                        <th>ID</th>
                        <th>Cliente</th>
                        <th>Total</th>
                        <th>Fecha</th>
                        <th>Estado</th>
                        <th>Acciones</th>
                    </tr>
                    </thead>

                    <tbody>
                    <tr th:each="p : ${pedidos}">
                        <td th:text="${p.id}"></td>

                        <td th:text="${p.usuario.nombre}"></td>

                        <td>
                            $<span th:text="${p.total}"></span>
                        </td>

                        <td th:text="${#temporals.format(p.fechaCreacion, 'dd/MM/yyyy HH:mm')}">
                        </td>

                        <td>
                            <span class="badge"
                                  th:classappend="
                                      ${p.estado.name()}=='NUEVO' ? ' bg-warning text-dark' :
                                      (${p.estado.name()}=='EN_PROCESO' ? ' bg-primary' :
                                      (${p.estado.name()}=='ENVIADO' ? ' bg-success' :
                                      (${p.estado.name()}=='PAGADO' ? ' bg-info text-dark' :
                                      (${p.estado.name()}=='ENTREGADO' ? ' bg-success' : ' bg-danger'))))
                                  "
                                  th:text="${p.estado}">
                            </span>
                        </td>

                        <td>
                            <a th:href="@{'/admin/pedidos/' + ${p.id}}"
                               class="btn btn-sm btn-dark">
                                <i class="bi bi-eye"></i> Ver
                            </a>
                        </td>
                    </tr>
                    </tbody>

                </table>
            </div>

        </div>
    </div>

</div>

<div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>
