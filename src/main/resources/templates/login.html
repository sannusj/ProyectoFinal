<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Iniciar Sesión | Solea</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container d-flex justify-content-center align-items-center" style="min-height:80vh;">
    <div class="card shadow-sm w-100" style="max-width:430px;">
        <div class="card-body p-4">

            <div class="text-center mb-3">
                <h2 class="fw-bold mb-0">SOLEA</h2>
                <p class="text-muted mb-0">Bienvenido, inicia sesión para continuar</p>
            </div>

            <!-- Mensaje de error -->
            <div th:if="${param.error}" class="alert alert-danger text-center">
                Usuario o contraseña incorrectos.
            </div>

            <!-- Mensaje de logout -->
            <div th:if="${param.logout}" class="alert alert-success text-center">
                Sesión cerrada correctamente.
            </div>

            <!-- FORMULARIO DE LOGIN -->
            <form th:action="@{/auth/login-process}" method="post">

                <div class="mb-3">
                    <label class="form-label">Correo electrónico</label>
                    <input type="text" class="form-control"
                           name="username" placeholder="Ingresa tu email" required autofocus>
                </div>

                <div class="mb-3">
                    <label class="form-label">Contraseña</label>
                    <input type="password" class="form-control"
                           name="password" placeholder="Ingresa tu contraseña" required>
                </div>

                <div class="d-grid mt-4">
                    <button type="submit" class="btn btn-dark py-2">Ingresar</button>
                </div>

            </form>

            <p class="text-center mt-3 mb-0">
                ¿No tienes cuenta?
                <a th:href="@{/auth/registro}" class="fw-semibold">Regístrate aquí</a>
            </p>

        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
