<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Contacto - Solea</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        .contact-card {
            border-radius: 14px;
            padding: 35px;
            background: white;
            box-shadow: 0 6px 18px rgba(0,0,0,0.08);
        }
        .icon-box {
            width: 55px;
            height: 55px;
            background: #000;
            color: #fff;
            border-radius: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 22px;
        }
    </style>
</head>

<body>

<!-- NAVBAR -->
<th:block th:replace="fragments/navbar :: navbar"></th:block>


<!-- ===================== CONTACTO ===================== -->
<div class="container mt-5 mb-5">

    <h1 class="fw-bold text-center mb-4">Contáctanos</h1>
    <p class="text-center text-muted mb-5">
        ¿Tienes alguna duda, sugerencia o necesitas ayuda? ¡Estamos para ayudarte!
    </p>

    <div class="row g-4">

        <!-- FORMULARIO -->
        <div class="col-lg-7">
            <div class="contact-card">
                <h4 class="fw-bold mb-4">Envíanos un mensaje</h4>

                <form method="post" th:action="@{/contacto/enviar}">
                    <div class="mb-3">
                        <label class="form-label">Nombre completo</label>
                        <input type="text" name="nombre" class="form-control" required placeholder="Tu nombre">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Correo electrónico</label>
                        <input type="email" name="email" class="form-control" required placeholder="tucorreo@mail.com">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Asunto</label>
                        <input type="text" name="asunto" class="form-control" required placeholder="Motivo de tu mensaje">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Mensaje</label>
                        <textarea name="mensaje" class="form-control" rows="5" required placeholder="Escribe tu mensaje aquí..."></textarea>
                    </div>

                    <button class="btn btn-dark px-4 py-2">Enviar mensaje</button>
                </form>
            </div>
        </div>


        <!-- INFORMACIÓN -->
        <div class="col-lg-5">
            <div class="contact-card h-100">
                <h4 class="fw-bold mb-4">Información de contacto</h4>

                <div class="d-flex align-items-center mb-4">
                    <div class="icon-box me-3">
                        <i class="bi bi-envelope"></i>
                    </div>
                    <div>
                        <p class="fw-bold mb-0">Correo</p>
                        <p class="text-muted small mb-0">soporte@solea.com</p>
                    </div>
                </div>

                <div class="d-flex align-items-center mb-4">
                    <div class="icon-box me-3">
                        <i class="bi bi-telephone"></i>
                    </div>
                    <div>
                        <p class="fw-bold mb-0">Teléfono</p>
                        <p class="text-muted small mb-0">+57 320 000 0000</p>
                    </div>
                </div>

                <div class="d-flex align-items-center mb-4">
                    <div class="icon-box me-3">
                        <i class="bi bi-geo-alt"></i>
                    </div>
                    <div>
                        <p class="fw-bold mb-0">Dirección</p>
                        <p class="text-muted small mb-0">Medellín, Colombia</p>
                    </div>
                </div>

            </div>
        </div>

    </div>
</div>


<!-- FOOTER -->
<th:block th:replace="fragments/footer :: footer"></th:block>


<!-- Bootstrap JS & Icons -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

</body>
</html>
