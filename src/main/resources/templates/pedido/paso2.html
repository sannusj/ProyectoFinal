<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Pedido - Paso 2</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container my-5">

    <!-- Barra de progreso -->
    <div class="progress mb-4" style="height: 20px;">
        <div class="progress-bar bg-warning" role="progressbar" style="width: 66%;">
            Paso 2 de 3
        </div>
    </div>

    <div class="card shadow p-4">
        <h3 class="mb-3">Datos de tarjeta</h3>

        <form action="/pedido/paso2" method="post">

            <div class="mb-3">
                <label class="form-label">Titular de la tarjeta</label>
                <input type="text" name="titular" class="form-control" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Número de tarjeta</label>
                <input type="text" name="numero" class="form-control" maxlength="16" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Tipo</label>
                <select name="tipoTarjeta" class="form-select">
                    <option>Visa</option>
                    <option>MasterCard</option>
                    <option>American Express</option>
                </select>
            </div>

            <button class="btn btn-warning w-100" type="submit">Continuar →</button>
        </form>
    </div>
</div>
</body>
</html>
