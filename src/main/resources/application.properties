# MySQL configuration (edit these values for your environment)
spring.datasource.url=jdbc:mysql://localhost:3306/soleadb?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=12345678
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
# Use 'update' for development; for production prefer 'validate' and manage schema with migrations
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
#spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.open-in-view=false

# File upload limits (images, etc.)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Thymeleaf (templates directory)
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# Server
server.port=8080

# Logging
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
# Logging to file for easier diagnosis
logging.file.name=logs/solea.log
logging.level.root=INFO

# Spring Security: if you want a default user for quick testing, uncomment and change
# spring.security.user.name=admin
# spring.security.user.password=admin
# spring.security.user.roles=ADMIN

# H2 console (left commented because we're using MySQL)
# spring.h2.console.enabled=true
# spring.h2.console.path=/h2-console

# ------------------------------------------------------------------
# NOTES & EXAMPLES
# ------------------------------------------------------------------
# If you prefer PostgreSQL, use:
# spring.datasource.url=jdbc:postgresql://localhost:5432/solea_db
# spring.datasource.username=postgres
# spring.datasource.password=change_me
# spring.datasource.driver-class-name=org.postgresql.Driver
# spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Important: ensure the JDBC driver dependency is present in pom.xml (e.g., mysql-connector-java)
# Example Maven dependency:
# <dependency>
#   <groupId>mysql</groupId>
#   <artifactId>mysql-connector-java</artifactId>
#   <scope>runtime</scope>
# </dependency>

# For production environments, set spring.profiles.active and keep sensitive credentials out of source control
# (use environment variables, a secrets manager, or application-{profile}.properties files).

# Nota: la clase de dialecto `org.hibernate.dialect.MySQL8Dialect` no existe en la versi?n de Hibernate incluida
# con Spring Boot 4/Hibernate 7; dejar la propiedad comentada permite que Hibernate detecte autom?ticamente
# el dialecto a partir de la metadata JDBC. Si necesitas forzar un dialecto espec?fico, usa la clase
# disponible en tu versi?n de Hibernate o elimina el comentario y actualiza el FQCN.

# Upload configuration
app.upload.dir=uploads/prendas
# tama?o m?ximo en bytes (5MB)
app.upload.max-size=5242880
# extensiones permitidas (minusculas, separadas por coma)
app.upload.allowed=png,jpg,jpeg,webp

# OAuth2 - Google (configuración activa - sustituir por variables de entorno en producción)
google.client.id=${GOOGLE_CLIENT_ID}
google.client.secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,profile,email
# Redirect URI (debe coincidir exactamente con lo registrado en Google Cloud Console)
spring.security.oauth2.client.registration.google.redirect-uri=http://localhost:8080/login/oauth2/code/google


