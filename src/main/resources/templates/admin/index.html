<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Panel de Administración</title>

    <!-- Bootstrap 5 -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">

    <!-- Iconos Bootstrap -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/solea-theme.css}" />
</head>
<body>

<!-- Navbar -->
<div th:replace="fragments/navbar :: navbar"></div>

<div class="container py-5">

    <h1 class="text-center mb-4 fw-bold">Panel de Administración</h1>
    <p class="text-center text-muted mb-5">Gestiona usuarios, pedidos y productos desde aquí.</p>

    <div class="row g-4">

        <!-- Usuarios -->
        <div class="col-md-4">
            <a href="/admin/usuarios" class="text-decoration-none">
                <div class="card shadow-sm border-0 h-100">
                    <div class="card-body text-center">
                        <i class="bi bi-people-fill fs-1 text-primary"></i>
                        <h4 class="mt-3">Usuarios</h4>
                        <p class="text-muted">Gestionar clientes, roles y detalles.</p>
                    </div>
                </div>
            </a>
        </div>

        <!-- Pedidos -->
        <div class="col-md-4">
            <a href="/admin/pedidos" class="text-decoration-none">
                <div class="card shadow-sm border-0 h-100">
                    <div class="card-body text-center">
                        <i class="bi bi-bag-check-fill fs-1 text-success"></i>
                        <h4 class="mt-3">Pedidos</h4>
                        <p class="text-muted">Ver pedidos realizados y actualizar estado.</p>
                    </div>
                </div>
            </a>
        </div>

        <!-- Prendas -->
        <div class="col-md-4">
            <a href="/admin/prendas" class="text-decoration-none">
                <div class="card shadow-sm border-0 h-100">
                    <div class="card-body text-center">
                        <i class="bi bi-shop-window fs-1 text-warning"></i>
                        <h4 class="mt-3">Prendas</h4>
                        <p class="text-muted">Agregar, editar o eliminar productos.</p>
                    </div>
                </div>
            </a>
        </div>

    </div>
</div>

<!-- Footer -->
<div th:replace="fragments/footer :: footer"></div>

</body>
</html>
